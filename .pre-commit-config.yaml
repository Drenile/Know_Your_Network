# Checks that run automatically before every `git commit`.
# One-time setup on each machine:  uv run pre-commit install
# Run on all files by hand:        uv run pre-commit run --all-files
#
# Remote hooks are pinned to an exact commit SHA, not a tag, because a tag can be
# moved to point at different code. To update: uv run pre-commit autoupdate --freeze

repos:
  # Block commits that contain secrets (API keys, passwords, private keys).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Fast code checks, using the exact versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
