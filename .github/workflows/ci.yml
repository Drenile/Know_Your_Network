# Runs every check on each push to main and on every pull request (D-009).
#
# Security rules for this file:
# - Every third-party action is pinned to a full commit SHA, not a tag.
# - The workflow token is read-only.
# - Checkout does not keep the token on disk after cloning.
# - Downloaded tools are pinned by version and verified by SHA-256 hash.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for all jobs: no permissions. Each job asks only for what it needs.
permissions: {}

# A new push cancels the older run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Exact images, not "-latest", so OS upgrades are a deliberate change.
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash  # Same shell on Windows (Git Bash) and Linux.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.22"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install project and dev tools
        run: uv sync --locked

      - name: Tests (pytest)
        run: uv run --locked pytest

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Formatting (ruff format)
        run: uv run --locked ruff format --check .

      - name: Types (mypy)
        run: uv run --locked mypy

      - name: Security lint (bandit)
        run: uv run --locked bandit -c pyproject.toml -r src

      - name: Known vulnerabilities (pip-audit)
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Scan every commit, not just the latest.
          persist-credentials: false

      # The expected hash is written here, not downloaded, so a tampered release
      # file fails the check. Hash source: gitleaks_8.30.1_checksums.txt.
      - name: Install gitleaks (verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
