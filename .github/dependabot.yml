# Dependabot opens pull requests when our pinned tools and actions have updates.
# Each update still has to pass CI before it can be merged.
#
# The 7-day cooldown is a supply-chain defence: a malicious release is usually
# spotted and pulled within days, so we let others find it first. Security fixes
# skip the cooldown.
#
# Not covered: the gitleaks binary and its hash in ci.yml. Update those by hand.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: "development"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
